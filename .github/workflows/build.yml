name: Test and publish image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One run per branch at a time. On main, runs queue instead of racing, so an older
# commit can never finish last and overwrite :latest with stale code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    env:
      # Only main publishes. A manual run on another branch builds and tests the image only.
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      # Docker Hub publishing turns on once the DOCKERHUB_TOKEN secret exists.
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_IMAGE: adiuv0/steelbook-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: steelbook-tracker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image and check it answers
        run: |
          # RUN_ON_START=false: no scan, so CI never touches Blu-ray.com.
          docker run -d --name smoke -p 8787:8787 -e RUN_ON_START=false steelbook-tracker:ci
          trap 'docker logs smoke' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8787/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/api/summary
          curl -fsS -o /dev/null http://127.0.0.1:8787/
          curl -fsS -o /dev/null http://127.0.0.1:8787/static/icon.png
          # The digest time relies on the image's timezone data (default TZ is Pacific).
          docker exec smoke date +%Z | grep -Eq '^P[SD]T$'
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true' && env.DOCKERHUB_TOKEN != ''
        with:
          username: adiuv0
          password: ${{ env.DOCKERHUB_TOKEN }}
      - id: tags
        if: env.PUBLISH == 'true'
        run: |
          {
            echo "list<<EOF"
            echo "ghcr.io/${{ github.repository_owner }}/steelbook-tracker:latest"
            echo "ghcr.io/${{ github.repository_owner }}/steelbook-tracker:${{ github.sha }}"
            if [ -n "$DOCKERHUB_TOKEN" ]; then
              echo "$DOCKERHUB_IMAGE:latest"
              echo "$DOCKERHUB_IMAGE:${{ github.sha }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - if: env.PUBLISH == 'true' && env.DOCKERHUB_TOKEN == ''
        run: echo "::warning::DOCKERHUB_TOKEN secret is not set, so the image was only pushed to ghcr.io."
      - uses: docker/build-push-action@v6
        if: env.PUBLISH == 'true'
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
