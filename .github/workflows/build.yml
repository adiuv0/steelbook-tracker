name: Test and publish image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
      # Docker Hub publishing turns on once the DOCKERHUB_TOKEN secret exists.
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_IMAGE: adiuv0/steelbook-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true' && env.DOCKERHUB_TOKEN != ''
        with:
          username: adiuv0
          password: ${{ env.DOCKERHUB_TOKEN }}
      - id: tags
        run: |
          {
            echo "list<<EOF"
            echo "ghcr.io/${{ github.repository_owner }}/steelbook-tracker:latest"
            echo "ghcr.io/${{ github.repository_owner }}/steelbook-tracker:${{ github.sha }}"
            if [ -n "$DOCKERHUB_TOKEN" ]; then
              echo "$DOCKERHUB_IMAGE:latest"
              echo "$DOCKERHUB_IMAGE:${{ github.sha }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - if: env.PUBLISH == 'true' && env.DOCKERHUB_TOKEN == ''
        run: echo "::warning::DOCKERHUB_TOKEN secret is not set, so the image was only pushed to ghcr.io."
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.tags.outputs.list }}
