name: Test and publish image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One run per branch at a time. On main, runs queue instead of racing, so an older
# commit can never finish last and overwrite :latest with stale code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # The browser reader's tests run a real Chromium against a stand-in shop on localhost.
      - run: python -m playwright install --with-deps --no-shell chromium
      - run: python -m pytest -q
        env:
          REQUIRE_BROWSER: "1"  # a missing browser fails those tests instead of skipping them

  image:
    needs: test
    runs-on: ubuntu-latest
    env:
      # Only main publishes. A manual run on another branch builds and tests the image only.
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      # Docker Hub publishing turns on once the DOCKERHUB_TOKEN secret exists.
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_IMAGE: adiuv0/steelbook-tracker
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: steelbook-tracker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image and check it answers
        run: |
          # RUN_ON_START=false: no scan, so CI never touches Blu-ray.com.
          docker run -d --name smoke -p 8787:8787 -e RUN_ON_START=false steelbook-tracker:ci
          trap 'docker logs smoke' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8787/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          # No folder is mapped to /data here, and the app has to notice that.
          summary=$(curl -fsS http://127.0.0.1:8787/api/summary)
          echo "$summary"
          grep -q '"data_persistent":false' <<<"$summary"
          grep -q 'role="alert"' <<<"$(curl -fsS http://127.0.0.1:8787/)"
          curl -fsS -o /dev/null http://127.0.0.1:8787/
          curl -fsS -o /dev/null http://127.0.0.1:8787/static/icon.png
          # The digest time relies on the image's timezone data (default TZ is Pacific).
          docker exec smoke date +%Z | grep -Eq '^P[SD]T$'
      - name: Read a stand-in shop with the image's own browser
        run: |
          # SHOP_READER=browser: Chromium, the libraries it needs and its profile under
          # /data all have to work inside the image, as root and with Docker's defaults,
          # the way Unraid runs it. The shops are stand-ins on localhost in the container.
          docker run --rm -v "$PWD/tests:/app/tests:ro" steelbook-tracker:ci python -m tests.browser_check
      - name: Check that a mapped data folder survives an update
        run: |
          # Mark something purchased, replace the container the way an update does,
          # and expect the mark to still be there.
          mkdir -p "$RUNNER_TEMP/data"
          start() {
            docker rm -f mapped >/dev/null 2>&1 || true
            docker run -d --name mapped -p 8788:8787 -e RUN_ON_START=false -v "$RUNNER_TEMP/data:/data" steelbook-tracker:ci
            for i in $(seq 1 30); do
              curl -fsS http://127.0.0.1:8788/healthz >/dev/null 2>&1 && break
              sleep 1
            done
          }
          trap 'docker logs mapped' EXIT
          start
          grep -q '"data_persistent":true' <<<"$(curl -fsS http://127.0.0.1:8788/api/summary)"
          docker exec mapped python -c "from app.main import db; db.insert_release({'id': 1, 'title': 'Smoke Test 4K', 'edition': None, 'studio': None, 'year': None, 'release_date': None, 'url': 'https://example.invalid/'}, seeding=True)"
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"value": true}' http://127.0.0.1:8788/api/releases/1/purchased
          start
          summary=$(curl -fsS http://127.0.0.1:8788/api/summary)
          echo "$summary"
          grep -q '"purchased":1,' <<<"$summary"
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true' && env.DOCKERHUB_TOKEN != ''
        with:
          username: adiuv0
          password: ${{ env.DOCKERHUB_TOKEN }}
      - id: tags
        if: env.PUBLISH == 'true'
        run: |
          {
            echo "list<<EOF"
            echo "ghcr.io/${{ github.repository_owner }}/steelbook-tracker:latest"
            echo "ghcr.io/${{ github.repository_owner }}/steelbook-tracker:${{ github.sha }}"
            if [ -n "$DOCKERHUB_TOKEN" ]; then
              echo "$DOCKERHUB_IMAGE:latest"
              echo "$DOCKERHUB_IMAGE:${{ github.sha }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - if: env.PUBLISH == 'true' && env.DOCKERHUB_TOKEN == ''
        run: echo "::warning::DOCKERHUB_TOKEN secret is not set, so the image was only pushed to ghcr.io."
      - uses: docker/build-push-action@v7
        if: env.PUBLISH == 'true'
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
